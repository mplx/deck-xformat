# Grimoire book configuration for the @skiffyard/texttransform documentation.

[book]
title = "@skiffyard/texttransform"
description = "Text transformations in printf's modifier style: case conversions (snake, kebab, camel, pascal, leet, ...), slicing, truncation"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://skiffyard.github.io/deck-texttransform/"
logo = "skiffyard.svg"
favicon = "skiffyard.svg"
repoUrl = "https://github.com/skiffyard/deck-texttransform"
repoLabel = "Source"
editUrl = "https://github.com/skiffyard/deck-texttransform/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/skiffyard">Skiffyard</a>, small community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
